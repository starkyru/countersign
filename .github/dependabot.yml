version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packages/sdk-python
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      python-sdk-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /examples/refund-agent
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      example-dependencies:
        patterns:
          - "*"
