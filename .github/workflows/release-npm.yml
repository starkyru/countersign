name: Publish React package

# The workflow filename must match the trusted publisher configured at
# npmjs.com exactly, including the .yml extension. Renaming this file breaks
# publishing with ENEEDAUTH.

on:
  push:
    tags: ["react-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and print the tarball without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @countersign-ai/react
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22 # trusted publishing needs Node >= 22.14.0
          cache: pnpm

      - name: Install an npm CLI that supports trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/react
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#react-v}"
          if [ "$version" != "$tag" ]; then
            echo "package.json version $version does not match tag $tag" >&2
            exit 1
          fi

      - name: Verify build output exists
        working-directory: packages/react
        run: |
          for file in dist/index.js dist/index.d.ts dist/index.css; do
            if [ ! -s "$file" ]; then
              echo "missing or empty build output: $file" >&2
              exit 1
            fi
          done

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/react
        run: npm publish --dry-run

      # No NODE_AUTH_TOKEN. The npm CLI exchanges the GitHub OIDC token for a
      # short-lived publish token, and generates provenance automatically.
      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        working-directory: packages/react
        run: npm publish
